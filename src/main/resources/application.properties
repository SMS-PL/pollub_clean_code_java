spring.application.name=clean-code-api
server.port=${PORT:8080}
spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Local persistent database; Hibernate updates the schema from entities.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/clean-code;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
